<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
  <title id="title">Study design and evidence structure</title>
  <desc id="desc">The analysis moves from multi-layer data to subtype-versus-stage analysis and then to within-Basal spatial remodeling. Evidence is grouped into an SPP1-associated immune-stromal axis and a parallel angiogenic axis. Evidence cards within each axis are parallel and do not imply causality.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .top-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .left-panel { fill: #fffaf5; stroke: #fdba74; stroke-width: 1.5; }
      .right-panel { fill: #f7fbff; stroke: #93c5fd; stroke-width: 1.5; }
      .inner-card { fill: #ffffff; stroke: #d6dce5; stroke-width: 1.25; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #94a3b8; stroke-width: 1.75; }
      .eyebrow { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: 1.25px; fill: #64748b; }
      .top-title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .top-note { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #526075; }
      .panel-title { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .panel-note { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #ffffff; opacity: 0.9; }
      .card-title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .card-body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #45536a; }
      .card-body-strong { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #273449; }
      .legend { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #526075; }
    </style>
  </defs>

  <rect width="1280" height="790" fill="#ffffff"/>

  <!-- Analysis framing -->
  <rect class="top-card" x="40" y="40" width="270" height="100" rx="12"/>
  <text class="eyebrow" x="62" y="66">DATA LAYERS</text>
  <text class="top-title" x="62" y="94">Japan-UTUC bulk</text>
  <text class="top-note" x="62" y="119">Internal scRNA-seq + Basal ST</text>

  <path class="arrow" d="M310 90 H330"/>

  <rect class="top-card" x="335" y="40" width="270" height="100" rx="12"/>
  <text class="eyebrow" x="357" y="66">QUESTION 1</text>
  <text class="top-title" x="357" y="94">Subtype or stage?</text>
  <text class="top-note" x="357" y="119">Which factor organizes the TME?</text>

  <path class="arrow" d="M605 90 H625"/>

  <rect class="top-card" x="630" y="40" width="270" height="100" rx="12"/>
  <text class="eyebrow" x="652" y="66">FINDING 1</text>
  <text class="top-title" x="652" y="94">Basal immune–stromal TME</text>
  <text class="top-note" x="652" y="119">Maintained across NMI and MI</text>

  <path class="arrow" d="M900 90 H920"/>

  <rect class="top-card" x="925" y="40" width="315" height="100" rx="12"/>
  <text class="eyebrow" x="947" y="66">QUESTION 2</text>
  <text class="top-title" x="947" y="94">Within-Basal: NMI versus MI</text>
  <text class="top-note" x="947" y="119">Cell-state and spatial remodeling</text>

  <!-- Branch from the within-Basal analysis to two evidence lines -->
  <path class="branch" d="M1082.5 140 V176 H420"/>
  <path class="branch" d="M1082.5 176 H1032.5"/>
  <path class="arrow" d="M420 176 V201"/>
  <path class="arrow" d="M1032.5 176 V201"/>

  <!-- SPP1-associated line -->
  <rect class="left-panel" x="40" y="205" width="760" height="520" rx="16"/>
  <path d="M56 205 H784 A16 16 0 0 1 800 221 V275 H40 V221 A16 16 0 0 1 56 205 Z" fill="#9a3412"/>
  <text class="panel-title" x="68" y="239">SPP1-associated immune–stromal axis</text>
  <text class="panel-note" x="68" y="262">Tissue, epithelial, external and clinical evidence are grouped here as parallel arms</text>

  <rect class="inner-card" x="70" y="305" width="330" height="380" rx="12"/>
  <text class="eyebrow" x="94" y="334">UTUC TISSUE PROGRAM</text>
  <text class="card-title" x="94" y="367">Invasive-front Niche1</text>
  <text class="card-title" x="94" y="394">SPP1+ TAM – FAP+ myCAF</text>
  <line x1="94" y1="416" x2="376" y2="416" stroke="#e2e8f0" stroke-width="1"/>
  <text class="card-body-strong" x="94" y="446">Related cellular context</text>
  <text class="card-body" x="94" y="471">Cancer_c0 and CCR2+ monocytes</text>
  <text class="card-body" x="94" y="515">• CellChat/NicheNet and spatial LR</text>
  <text class="card-body" x="94" y="548">• Boundary enrichment</text>
  <text class="card-body" x="94" y="581">• Effector-immune gradients</text>
  <text class="card-body" x="94" y="614">• Multiplex IF tissue support</text>

  <text class="eyebrow" x="425" y="318">PARALLEL EVIDENCE WITHIN THE SPP1 LINE</text>

  <rect class="inner-card" x="425" y="335" width="345" height="100" rx="12"/>
  <text class="card-title" x="448" y="366">Epithelial SPP1</text>
  <text class="card-body" x="448" y="393">Malignant-cell expression and virtual knockout</text>
  <text class="card-body" x="448" y="416">J82 phenotypes and HUVEC tube formation</text>

  <rect class="inner-card" x="425" y="450" width="345" height="105" rx="12"/>
  <text class="card-title" x="448" y="481">External urothelial carcinoma</text>
  <text class="card-body" x="448" y="508">BLCA bulk and single-cell datasets</text>
  <text class="card-body" x="448" y="531">Visium, Visium HD/RCTD and GeoMx</text>

  <rect class="inner-card" x="425" y="570" width="345" height="115" rx="12"/>
  <text class="card-title" x="448" y="601">Clinical and biomarker assessment</text>
  <text class="card-body" x="448" y="628">Japan-UTUC Niche1 association</text>
  <text class="card-body" x="448" y="651">SPP1/FAP classification and prognosis</text>
  <text class="card-body" x="448" y="674">SPP1 PheW-MR (exploratory)</text>

  <!-- Parallel angiogenic line -->
  <rect class="right-panel" x="825" y="205" width="415" height="520" rx="16"/>
  <path d="M841 205 H1224 A16 16 0 0 1 1240 221 V275 H825 V221 A16 16 0 0 1 841 205 Z" fill="#1e40af"/>
  <text class="panel-title" x="853" y="239">Parallel angiogenic axis</text>
  <text class="panel-note" x="853" y="262">A distinct MI-associated program</text>

  <rect class="inner-card" x="855" y="305" width="355" height="105" rx="12"/>
  <text class="eyebrow" x="878" y="334">RELATED MALIGNANT STATE</text>
  <text class="card-title" x="878" y="365">Cancer_c3</text>
  <text class="card-body" x="878" y="390">Hypoxia, glycolysis and angiogenesis;</text>
  <text class="card-body" x="878" y="410">assessed separately from the cell pair</text>

  <rect class="inner-card" x="855" y="425" width="355" height="135" rx="12"/>
  <text class="eyebrow" x="878" y="454">UTUC TISSUE PROGRAM</text>
  <text class="card-title" x="878" y="485">Niche2</text>
  <text class="card-title" x="878" y="512">VEGFA+ TAN – CXCR4+ tip EC</text>
  <text class="card-body" x="878" y="540">Spatial LR, co-enrichment and multiplex IF</text>

  <rect class="inner-card" x="855" y="575" width="355" height="110" rx="12"/>
  <text class="eyebrow" x="878" y="604">SUPPORTING ASSOCIATIONS</text>
  <text class="card-body" x="878" y="633">Cancer_c3: external MIBC + Japan-UTUC</text>
  <text class="card-body" x="878" y="659">Niche2: Japan-UTUC muscle invasion</text>

  <!-- Legend -->
  <path class="arrow" d="M42 758 H84"/>
  <text class="legend" x="98" y="763">Analysis sequence</text>
  <rect x="330" y="746" width="44" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="legend" x="389" y="763">Grouped evidence within one research line; no causal direction is implied</text>
</svg>
